<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk-In Jobs · Bangalore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --ink:      #ede9e3;
  --ink2:     #9c9488;
  --ink3:     #5a5650;
  --ink4:     #2e2c2a;
  --bg:       #0e0d0c;
  --bg2:      #141210;
  --bg3:      #1a1816;
  --line:     rgba(237,233,227,.06);
  --line2:    rgba(237,233,227,.12);
  --gold:     #c9a86c;
  --gold2:    #8a6e3e;

  /* domain accent stripes */
  --soc:      #6baed6;
  --grc:      #9d8be0;
  --appsec:   #52b788;
  --vapt:     #e07a5f;
  --cloud:    #74b4e8;
  --iam:      #e085ad;
  --risk:     #d4a84b;
  --fraud:    #c47dd4;
  --forensics:#4ecdc4;
  --general:  #888580;

  --r:        4px;
  --tx: cubic-bezier(.4,0,.2,1);
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14px;-webkit-font-smoothing:antialiased;}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  /* subtle grain */
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
header {
  position: sticky;top:0;z-index:100;
  background: rgba(14,13,12,.88);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1440px;margin:0 auto;
  display: flex;align-items: center;gap: 2rem;
  padding: 0 2.5rem;height: 56px;
}

.wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;font-size: 1.25rem;
  letter-spacing: .02em;
  white-space: nowrap;
  color: var(--ink);
  display: flex;align-items: baseline;gap: .5rem;
}
.wordmark em {
  font-style: italic;
  color: var(--gold);
}
.wordmark sup {
  font-family: 'Geist Mono', monospace;
  font-size: .55rem;font-weight: 400;
  color: var(--ink3);letter-spacing: .1em;
  text-transform: uppercase;
  margin-left: 2px;
}

.search-wrap {position:relative;flex:1;max-width:360px;}
.search-wrap svg {
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--ink3);pointer-events:none;
}
#searchInput {
  width:100%;padding:7px 12px 7px 30px;
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--r);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  font-size: .85rem;font-weight:300;
  outline: none;
  transition: border-color .2s var(--tx);
}
#searchInput:focus{border-color:var(--line2);}
#searchInput::placeholder{color:var(--ink3);}

.header-right {
  margin-left: auto;
  display: flex;align-items:center;gap:1.5rem;
}
.hstat {
  font-family:'Geist Mono',monospace;
  font-size:.65rem;color:var(--ink3);
  text-align:right;line-height:1.5;
}
.hstat strong{
  display:block;font-size:.95rem;font-weight:400;
  color:var(--ink);font-family:'Cormorant Garamond',serif;
  letter-spacing:.02em;
}

.sort-wrap select {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--r);
  color: var(--ink2);
  font-family: 'Geist Mono', monospace;
  font-size: .65rem;
  padding: 5px 8px;
  outline: none;
  cursor: pointer;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.sort-wrap select option{background:var(--bg2);}
.sort-wrap select:focus{border-color:var(--line2);}

/* ── FILTER BAR ──────────────────────────────────────────────────────────── */
.filter-strip {
  max-width:1440px;margin:0 auto;
  padding: 1rem 2.5rem;
  display:flex;flex-wrap:wrap;gap:.375rem;
  border-bottom: 1px solid var(--line);
}
.flabel {
  font-family:'Geist Mono',monospace;font-size:.6rem;
  color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;
  align-self:center;margin-right:.25rem;
}
.chip {
  padding:4px 10px;
  border-radius:999px;
  font-family:'Geist Mono',monospace;
  font-size:.65rem;font-weight:400;
  letter-spacing:.04em;
  cursor:pointer;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink3);
  transition:all .15s var(--tx);
}
.chip:hover{color:var(--ink2);border-color:var(--line2);}
.chip.active{
  background: var(--bg3);
  border-color:var(--line2);
  color:var(--ink);
}

.sep {width:1px;height:16px;background:var(--line2);align-self:center;margin:0 .25rem;}

/* ── MAIN GRID ───────────────────────────────────────────────────────────── */
.page {
  max-width:1440px;margin:0 auto;
  padding:0 2.5rem 4rem;
}

/* count bar */
.count-bar {
  padding: .75rem 0;
  border-bottom: 1px solid var(--line);
  font-family:'Geist Mono',monospace;font-size:.65rem;
  color:var(--ink3);letter-spacing:.05em;
  display:flex;gap:1rem;align-items:center;
}
.count-bar span{color:var(--ink2);}

/* grid */
#cardGrid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap:1px;
  background: var(--line);
  margin-top:0;
}

/* ── CARD ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--bg);
  padding: 1.5rem 1.5rem 1.25rem;
  position:relative;
  transition: background .15s var(--tx);
  animation: fadeUp .3s var(--tx) both;
  display:flex;flex-direction:column;gap:.75rem;
  overflow:hidden;
}
.card::before {
  content:'';
  position:absolute;top:0;left:0;
  width:3px;height:100%;
  background: var(--domain-color, var(--general));
  opacity:.7;
}
.card:hover{background:var(--bg2);}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

/* domain color binding */
.card[data-domain="SOC"]      {--domain-color:var(--soc);}
.card[data-domain="GRC"]      {--domain-color:var(--grc);}
.card[data-domain="AppSec"]   {--domain-color:var(--appsec);}
.card[data-domain="VAPT"]     {--domain-color:var(--vapt);}
.card[data-domain="CloudSec"] {--domain-color:var(--cloud);}
.card[data-domain="IAM"]      {--domain-color:var(--iam);}
.card[data-domain="Risk"]     {--domain-color:var(--risk);}
.card[data-domain="Fraud-AML"]{--domain-color:var(--fraud);}
.card[data-domain="Forensics"]{--domain-color:var(--forensics);}
.card[data-domain="General"]  {--domain-color:var(--general);}

/* card header */
.card-header {
  display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;
}
.domain-tag {
  font-family:'Geist Mono',monospace;font-size:.58rem;
  font-weight:400;letter-spacing:.1em;text-transform:uppercase;
  color: var(--domain-color, var(--general));
  opacity:.9;white-space:nowrap;padding-top:1px;
}
.intern-pip {
  font-family:'Geist Mono',monospace;font-size:.55rem;
  letter-spacing:.08em;color:var(--risk);
  background:rgba(212,168,75,.08);
  border:1px solid rgba(212,168,75,.2);
  border-radius:3px;padding:1px 5px;
  white-space:nowrap;
}

/* title */
.card-title {
  font-family:'Cormorant Garamond',serif;
  font-weight:400;font-size:1.2rem;
  line-height:1.3;
  color:var(--ink);
  letter-spacing:.01em;
}

/* company */
.card-company {
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
}
.company-name {
  font-size:.82rem;font-weight:400;
  color:var(--ink2);letter-spacing:.01em;
}
.tier-pill {
  font-family:'Geist Mono',monospace;font-size:.55rem;
  letter-spacing:.08em;text-transform:uppercase;
  padding:1px 5px;border-radius:2px;
}
.tier-mnc     {color:#6baed6;background:rgba(107,174,214,.08);border:1px solid rgba(107,174,214,.18);}
.tier-startup {color:#52b788;background:rgba(82,183,136,.08);border:1px solid rgba(82,183,136,.18);}
.tier-mid     {color:#d4a84b;background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.18);}
.tier-unknown {color:var(--ink3);background:transparent;border:1px solid var(--line);}

/* summary */
.card-summary {
  font-size:.8rem;color:var(--ink3);
  line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* meta row */
.card-meta {
  display:flex;flex-wrap:wrap;gap:.5rem .75rem;
  font-family:'Geist Mono',monospace;font-size:.62rem;
  color:var(--ink3);letter-spacing:.03em;
}
.meta-item {
  display:flex;align-items:center;gap:.3rem;
}
.meta-item svg{width:10px;height:10px;flex-shrink:0;}

/* scores */
.card-scores {
  display:flex;gap:1.25rem;align-items:center;
  padding:.625rem 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.score-block{display:flex;flex-direction:column;gap:.3rem;}
.score-label{
  font-family:'Geist Mono',monospace;font-size:.55rem;
  color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;
}
.score-bar{
  display:flex;gap:2px;align-items:center;
}
.score-bar .pip {
  width:14px;height:3px;border-radius:2px;
  background:var(--ink4);
  transition:background .2s;
}
.score-bar .pip.on { background: var(--pip-color, var(--gold));}
.score-num{
  font-family:'Geist Mono',monospace;font-size:.65rem;
  margin-left:.4rem;
}
.hi  {--pip-color:#52b788;color:#52b788;}
.med {--pip-color:#d4a84b;color:#d4a84b;}
.lo  {--pip-color:#e07a5f;color:#e07a5f;}

/* actions */
.card-actions {
  display:flex;gap:.5rem;flex-wrap:wrap;
  margin-top:auto;
}
.btn {
  display:inline-flex;align-items:center;gap:.35rem;
  padding:5px 11px;border-radius:var(--r);
  font-family:'Geist Mono',monospace;
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;
  border:1px solid transparent;
  cursor:pointer;
  transition:all .15s var(--tx);
  font-weight:400;
}
.btn svg{width:10px;height:10px;flex-shrink:0;}
.btn-apply {
  background:var(--domain-color,var(--general));
  color:var(--bg);border-color:transparent;
  opacity:.85;
}
.btn-apply:hover{opacity:1;}
.btn-doc,.btn-pdf {
  background:transparent;
  border-color:var(--line2);
  color:var(--ink2);
}
.btn-doc:hover,.btn-pdf:hover{border-color:var(--line2);color:var(--ink);background:var(--bg3);}

/* ── EMPTY ───────────────────────────────────────────────────────────────── */
#emptyState {
  display:none;
  grid-column:1/-1;
  padding:5rem 2rem;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:1.4rem;
  color:var(--ink3);
}

/* ── SCROLLBAR ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:3px;}

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
@media(max-width:640px){
  .header-inner,.filter-strip,.page{padding-left:1rem;padding-right:1rem;}
  .hstat:not(:first-child){display:none;}
  #cardGrid{grid-template-columns:1fr;}
}
</style>
</head>

</header>

  <button class="chip" data-domain="IAM">IAM</button>
  <button class="chip" data-domain="Risk">Risk</button>
  <button class="chip" data-domain="Fraud-AML">Fraud</button>

</div>

<main class="page">

  </div>
</main>

/* ── HELPERS ──────────────────────────────────────────────────────────────── */
function getTier(c){
  const s=(c||'').toLowerCase();
  if(s.includes('(mnc)'))return'MNC';
  if(s.includes('(startup)'))return'startup';
  if(s.includes('(mid-tier)'))return'mid-tier';
  return'unknown';
}
function stripTier(c){return(c||'').replace(/\s*\(.*?\)\s*$/,'').trim();}

function scoreClass(n){
  if(!n&&n!==0)return'lo';
  return n>=6?'hi':n>=4?'med':'lo';
}

function pipBar(score,max){
  let h='<div class="score-bar">';
  const cls=scoreClass(score);
  for(let i=1;i<=max;i++)
    h+=`<span class="pip${i<=score?' on '+cls:''}"></span>`;
  h+='</div>';
  return h;
}

function buildCard(j,idx){
  const tier=getTier(j.company);
  const name=stripTier(j.company);
  const isIntern=/intern|trainee|apprentice/i.test(j.job_title+' '+(j.experience_required||''));
  const tierMap={MNC:'tier-mnc',startup:'tier-startup','mid-tier':'tier-mid',unknown:'tier-unknown'};

  const meta=[];
  if(j.experience_required)meta.push(`<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>${j.experience_required}</span>`);
  if(j.salary_range)meta.push(`<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v2m0 8v2M8.5 9.5A3.5 3.5 0 0 1 12 8h.5a3 3 0 0 1 0 6H12a3 3 0 0 0 0 6h.5A3.5 3.5 0 0 0 15.5 17"/></svg>${j.salary_range}</span>`);
  if(j.posted_date)meta.push(`<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${j.posted_date.slice(5)}</span>`);
  const srcMap={linkedin:'LI',linkedin_post:'LI+',workday:'WD',ashby:'AB'};
  meta.push(`<span class="meta-item" style="color:var(--ink4)">${srcMap[j.source]||j.source}</span>`);

  const hire=j.hireability,cred=j.credibility;
  const hasScores=(hire!==null&&hire!==undefined)||(cred!==null&&cred!==undefined);

  return`<div class="card" data-domain="${j.domain}" data-tier="${tier}"
    data-title="${(j.job_title||'').toLowerCase()}"
    data-company="${(j.company||'').toLowerCase()}"
    style="animation-delay:${(idx%24)*0.025}s">
  <div class="card-header">
    <span class="domain-tag">${j.domain}</span>
    ${isIntern?'<span class="intern-pip">Intern</span>':''}
  </div>
  <div class="card-title">${j.job_title}</div>
  <div class="card-company">
    <span class="company-name">${name}</span>
    <span class="tier-pill ${tierMap[tier]}">${tier==='unknown'?'—':tier}</span>
  </div>
  ${j.summary?`<div class="card-summary">${j.summary}</div>`:''}
  ${meta.length?`<div class="card-meta">${meta.join('')}</div>`:''}
  ${hasScores?`<div class="card-scores">
    ${hire!=null?`<div class="score-block">
      <span class="score-label">Hireability</span>
      <div style="display:flex;align-items:center">
        ${pipBar(hire,7)}
        <span class="score-num ${scoreClass(hire)}">${hire}/7</span>
      </div>
    </div>`:''}
    ${cred!=null?`<div class="score-block">
      <span class="score-label">Credibility</span>
      <div style="display:flex;align-items:center">
        ${pipBar(cred,6)}
        <span class="score-num hi">${cred}/6</span>
      </div>
    </div>`:''}
  </div>`:''}
  <div class="card-actions">
    <a href="${j.apply_url}" target="_blank" rel="noopener" class="btn btn-apply">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>Apply
    </a>
    ${j.resume_doc_link?`<a href="${j.resume_doc_link}" target="_blank" rel="noopener" class="btn btn-doc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>.doc</a>`:''}
    ${j.resume_pdf_link?`<a href="${j.resume_pdf_link}" target="_blank" rel="noopener" class="btn btn-pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>.pdf</a>`:''}
  </div>
</div>`;
}

/* ── STATE & RENDER ───────────────────────────────────────────────────────── */
let domainFilter='all',tierFilter='all',searchQ='',sortBy='default';

function filtered(){
  let d=[...JOBS];
  if(domainFilter!=='all')d=d.filter(j=>j.domain===domainFilter);
  if(tierFilter!=='all')d=d.filter(j=>getTier(j.company)===tierFilter);
  if(searchQ){
    const q=searchQ.toLowerCase();
    d=d.filter(j=>(j.job_title||'').toLowerCase().includes(q)||
                   (j.company||'').toLowerCase().includes(q)||
                   (j.summary||'').toLowerCase().includes(q));
  }
  if(sortBy==='hireability')d.sort((a,b)=>(b.hireability||0)-(a.hireability||0));
  else if(sortBy==='credibility')d.sort((a,b)=>(b.credibility||0)-(a.credibility||0));
  else if(sortBy==='date')d.sort((a,b)=>(b.posted_date||'').localeCompare(a.posted_date||''));
  else if(sortBy==='az')d.sort((a,b)=>(a.job_title||'').localeCompare(b.job_title||''));
  return d;
}

function render(){
  const d=filtered();
  const grid=document.getElementById('cardGrid');
  const empty=document.getElementById('emptyState');
  document.getElementById('shownCount').textContent=d.length;
  if(!d.length){grid.innerHTML='';grid.appendChild(empty);empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=d.map((j,i)=>buildCard(j,i)).join('');
}

function initStats(){
  document.getElementById('totalCount').textContent=JOBS.length;
  document.getElementById('mncCount').textContent=JOBS.filter(j=>getTier(j.company)==='MNC').length;
  document.getElementById('internCount').textContent=JOBS.filter(j=>/intern|trainee|apprentice/i.test(j.job_title)).length;
}

/* ── EVENTS ───────────────────────────────────────────────────────────────── */
document.querySelectorAll('.chip[data-domain]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip[data-domain]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');domainFilter=b.dataset.domain;render();
}));
document.querySelectorAll('.chip[data-tier]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip[data-tier]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');tierFilter=b.dataset.tier;render();
}));
document.getElementById('searchInput').addEventListener('input',e=>{searchQ=e.target.value.trim();render();});
document.getElementById('sortSelect').addEventListener('change',e=>{sortBy=e.target.value;render();});

initStats();render();
</script>
