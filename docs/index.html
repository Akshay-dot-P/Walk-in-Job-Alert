<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk-In Jobs · Bangalore</title>
<style>
:root{
  --bg:#f6f7f5;
  --surface:#fffefb;
  --surface2:#f4f6f5;
  --surface3:#e8ece9;
  --sep:#e4e7e2;
  --sep2:#edf0eb;
  --t1:#22231f;
  --t2:#5c625d;
  --t3:#899088;
  --t4:#aeb6ad;
  --green:#506f62;
  --amber:#9b7a3f;
  --red:#a45c52;
  --blue:#2f8ed8;
  --blue2:#eaf5ff;
  --ease: cubic-bezier(.4,0,.2,1);
  --r:8px;
  --r-sm:7px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  background:
    linear-gradient(180deg,#f8f8f5 0%,#f6f7f5 48%,#f1f6f7 100%);
  color:var(--t1);min-height:100vh;
}

/* NAVBAR */
.navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(248,248,245,.88);
  backdrop-filter:saturate(160%) blur(18px);
  -webkit-backdrop-filter:saturate(160%) blur(18px);
  border-bottom:1px solid var(--sep2);
}
.nav-inner{
  max-width:900px;margin:0 auto;padding:0 24px;
  min-height:62px;display:flex;align-items:center;gap:14px;
}
.nav-logo{font-size:.9rem;font-weight:650;color:var(--t1);white-space:nowrap;flex-shrink:0;}
.nav-logo span{color:var(--blue);font-weight:600;}
.search-box{flex:1;max-width:330px;position:relative;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--t4);pointer-events:none;}
#q{
  width:100%;padding:8px 12px 8px 32px;
  background:rgba(255,255,255,.72);border:1px solid var(--sep);border-radius:999px;
  font-family:inherit;font-size:.82rem;color:var(--t1);outline:none;transition:border-color .18s,background .18s;
}
#q::placeholder{color:var(--t4);}
#q:focus{border-color:rgba(47,142,216,.35);background:#fff;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.nav-stat{text-align:right;}
.nav-stat .nv{font-size:.86rem;font-weight:650;color:var(--t1);font-variant-numeric:tabular-nums;}
.nav-stat .nl{font-size:.58rem;font-weight:650;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;}
.sort-sel,
.filter-select{
  background:rgba(255,255,255,.64);border:1px solid var(--sep);border-radius:999px;
  color:var(--t2);font-family:inherit;font-size:.72rem;font-weight:550;
  padding:6px 10px;cursor:pointer;outline:none;
}
.filter-select{min-width:138px;height:29px;flex-shrink:0;}
.sort-sel option,
.filter-select option{background:#fffefb;}
.sort-sel:focus,
.filter-select:focus{border-color:rgba(47,142,216,.35);}

/* FILTER RAIL */
.filter-rail{border-bottom:1px solid var(--sep2);background:rgba(248,248,245,.8);backdrop-filter:blur(12px);}
.filter-inner{
  max-width:900px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:8px;min-height:50px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-inner::-webkit-scrollbar{display:none;}
.fg{font-size:.59rem;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;flex-shrink:0;margin-right:2px;}
.fbar{width:1px;height:14px;background:var(--sep);flex-shrink:0;margin:0 3px;}
.tier-break{margin-left:auto;}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;
  font-family:inherit;font-size:.68rem;font-weight:550;
  border:1px solid transparent;background:transparent;color:var(--t3);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .14s var(--ease);outline:none;-webkit-tap-highlight-color:transparent;
}
.chip:hover{color:var(--t1);background:rgba(255,255,255,.68);}
.chip.on{background:#fff;border-color:var(--sep);color:var(--t1);font-weight:650;box-shadow:0 1px 8px rgba(40,34,24,.035);}
.chip-link{color:#3b6f9a;}
.chip-link.on{background:#eef6ff;border-color:#cfe4f7;color:#285f92;}
.chip .pip{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:26px 24px 64px;}
.updated-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.updated-bar .ul{font-size:.72rem;color:var(--t3);}
.updated-bar .ul strong{color:var(--t2);font-weight:600;}
.updated-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.res-count{font-size:.72rem;color:var(--t3);font-variant-numeric:tabular-nums;}
.res-count strong{color:var(--t1);font-weight:650;}

/* SECTION HEADERS */
.section-head{padding:20px 0 9px;border-bottom:1px solid var(--sep2);margin-bottom:8px;display:flex;align-items:baseline;gap:6px;}
.section-head:not(:first-child){margin-top:20px;}
.sh-label{font-size:.65rem;font-weight:780;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);}
.sh-sub{font-size:.68rem;color:var(--t4);font-weight:400;}

/* CARD */
.card{
  background:linear-gradient(180deg,rgba(255,254,251,.98),rgba(250,251,248,.94));
  border-radius:var(--r);border:1px solid rgba(226,230,224,.92);
  padding:17px 18px;margin-bottom:14px;
  display:grid;grid-template-columns:46px minmax(0,1fr) 92px;gap:16px;align-items:start;
  animation:up .28s var(--ease) both;
  position:relative;overflow:hidden;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;
  box-shadow:0 1px 2px rgba(39,42,36,.025),0 8px 24px rgba(39,42,36,.025);
}
.card:hover{
  background:linear-gradient(180deg,#fff,#fbfcfa);
  border-color:#dfe8e3;
  box-shadow:0 2px 5px rgba(39,42,36,.035),0 14px 34px rgba(39,42,36,.055);
  transform:translateY(-1px);
}
@keyframes up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.logo-chip{
  width:40px;height:40px;border-radius:8px;background:linear-gradient(145deg,#fbfcfa,#edf4f2);
  border:1px solid #e1eae5;display:flex;align-items:center;justify-content:center;
  color:#4f6259;font-size:.7rem;font-weight:770;letter-spacing:.04em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 1px 2px rgba(44,50,43,.035);
}
.card-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card-title{font-size:.97rem;font-weight:750;line-height:1.32;color:var(--t1);}
	.new-badge,.applied-badge,.invalid-badge{
	  display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;
	  font-size:.56rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
	  flex-shrink:0;margin-top:2px;white-space:nowrap;
	}
	.new-badge{background:rgba(82,117,104,.08);color:var(--green);border:1px solid rgba(82,117,104,.15);}
	.applied-badge{background:rgba(155,122,63,.08);color:var(--amber);border:1px solid rgba(155,122,63,.16);}
	.invalid-badge{background:rgba(164,92,82,.08);color:var(--red);border:1px solid rgba(164,92,82,.18);}
.co-row{font-size:.77rem;color:var(--t2);font-weight:460;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.co-sep{color:var(--t4);}
.co-tier{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--sep2);background:var(--surface2);color:var(--t3);}
.co-mnc,.co-startup,.co-mid{color:var(--t3);background:var(--surface2);border-color:var(--sep2);}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;}
.tag{
  display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:7px;
  font-size:.64rem;font-weight:620;border:1px solid var(--sep2);white-space:nowrap;
  color:#7c867e;background:rgba(247,248,246,.9);
}
.card-summary{font-size:.76rem;color:#626a64;line-height:1.5;font-weight:400;max-width:620px;}
.card-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:3px;}
.btn-apply{
  display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
  font-family:inherit;font-size:.72rem;font-weight:620;text-decoration:none;
  background:#edf7ff;color:#2f6798;border:1px solid #cfe4f7;cursor:pointer;
  transition:background .14s,border-color .14s,transform .12s,box-shadow .14s;
  box-shadow:none;
}
.btn-apply:hover{background:#e2f1ff;border-color:#bad8f1;transform:translateY(-1px);box-shadow:none;}
.btn-apply:active{transform:none;}
.btn-apply:focus-visible{outline:3px solid rgba(41,151,255,.2);outline-offset:2px;}
.btn-apply svg{width:11px;height:11px;flex-shrink:0;}
.btn-sm{
  display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;
  font-family:inherit;font-size:.7rem;font-weight:600;text-decoration:none;
  background:transparent;color:var(--t2);border:1px solid var(--sep2);cursor:pointer;
  transition:all .14s var(--ease);
}
.btn-sm:hover{color:var(--t1);border-color:#dcd3c7;background:rgba(255,255,255,.58);}
.btn-sm svg{width:10px;height:10px;flex-shrink:0;}
	.btn-mark-applied{color:var(--green);background:rgba(82,117,104,.06);border-color:rgba(82,117,104,.18);}
	.btn-mark-applied:hover{color:var(--green);border-color:rgba(82,117,104,.3);}
	.btn-mark-applied.is-applied{color:var(--amber);background:rgba(155,122,63,.06);border-color:rgba(155,122,63,.18);}
	.btn-mark-applied.is-applied:hover{color:var(--amber);border-color:rgba(155,122,63,.3);}
	.btn-mark-invalid{color:var(--red);background:rgba(164,92,82,.055);border-color:rgba(164,92,82,.16);}
	.btn-mark-invalid:hover{color:var(--red);border-color:rgba(164,92,82,.28);background:rgba(164,92,82,.08);}
	.card.is-invalid{background:linear-gradient(180deg,rgba(255,251,250,.96),rgba(250,247,246,.94));border-color:rgba(164,92,82,.16);}

/* SCORE PANEL */
.card-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;min-width:92px;padding-top:4px;}
.score-line{width:32px;height:2px;border-radius:999px;background:var(--green);opacity:.58;}
.odds-pct{font-size:.72rem;font-weight:650;color:var(--t2);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.odds-pct.hi,.odds-pct.med,.odds-pct.lo{color:var(--t2);}

/* EMPTY STATE */
#empty{display:none;padding:80px 20px;text-align:center;}
.ei{font-size:2rem;margin-bottom:10px;}
.et{font-size:.95rem;font-weight:600;color:var(--t1);margin-bottom:4px;}
.es{font-size:.78rem;color:var(--t3);}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d7d0c6;border-radius:3px;}

@media(max-width:600px){
  .nav-inner{padding:10px 16px;flex-wrap:wrap;}
  .search-box{order:3;max-width:none;flex-basis:100%;}
  .nav-right{gap:10px;}
  .nav-right .nav-stat:not(:first-child){display:none;}
  .filter-inner,.page{padding-left:16px;padding-right:16px;}
  .tier-break{margin-left:3px;}
  .card{grid-template-columns:40px minmax(0,1fr);gap:12px;}
  .logo-chip{width:36px;height:36px;font-size:.66rem;}
  .card-right{grid-column:2;justify-content:flex-start;padding-top:0;}
  .card-actions{gap:5px;}
}
</style>
</head>

</div>

<main class="page">

const APPLIED_STORE_KEY = 'cyberjobs-applied-v1';
const INVALID_STORE_KEY = 'cyberjobs-invalid-v1';
const VALID_STORE_KEY = 'cyberjobs-valid-v1';
const SHEETS_MARK_APPLIED_URL = 'https://script.google.com/macros/s/AKfycbyuS_0duwwxnL4J2RcorwfpQ3eQUBZJcIqha4lP8yLSf-acsjb7KOODnWXzfFKrVjAn/exec'; // Hardcode your deployed Google Apps Script Web App /exec URL here.

function loadStoredKeys(storeKey){
  try{ return new Set(JSON.parse(localStorage.getItem(storeKey) || '[]')); }
  catch(e){ return new Set(); }
}
function saveStoredKeys(storeKey, keys){
  try{ localStorage.setItem(storeKey, JSON.stringify([...keys])); }
  catch(e){}
}
function submitSheetSyncForm(endpoint, fields){
  const frameName = 'sheetSyncFrame';
  let frame = document.getElementById(frameName);
  if(!frame){
    frame = document.createElement('iframe');
    frame.id = frameName;
    frame.name = frameName;
    frame.style.display = 'none';
    document.body.appendChild(frame);
  }

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = endpoint;
  form.target = frameName;
  form.style.display = 'none';

  Object.entries(fields).forEach(([name, value]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value == null ? '' : String(value);
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  setTimeout(() => form.remove(), 1200);
}
function jobKey(j){ return (j.apply_url || `${j.company || ''}|${j.job_title || ''}`).trim(); }
function normStatus(j){ return (j.status || '').trim().toLowerCase(); }
function isApplied(j){ return normStatus(j) === 'applied'; }
function isInvalid(j){ return normStatus(j) === 'invalid'; }
function isNewJob(j){ return !isApplied(j) && !isInvalid(j) && j._idx >= newCutoff; }
function looksLikeDirectoryListing(j){
  const text = `${j.job_title || ''} ${j.summary || ''}`.toLowerCase();
  const hasCountedJobs = /\bfind\s+\d+\s+(?:best\s+)?/.test(text) && /\bjobs?\b/.test(text);
  const hasInternshipDirectoryShape = /\binternships?\s+in\b/.test(text) && /\bjobs?\s+in\b/.test(text);
  return hasCountedJobs && (hasInternshipDirectoryShape || text.includes('internshala'));
}
function syncStatusToSheet(j, status, action){
  const endpoint = SHEETS_MARK_APPLIED_URL.trim();
  if(!endpoint){
    console.warn('SHEETS_MARK_APPLIED_URL is empty. Paste your deployed Apps Script /exec URL into index.html.');
    return Promise.resolve(false);
  }
  const appliedAt = status === 'Applied' ? (j.applied_at || new Date().toISOString()) : '';
  const fields = {
    action: action || (status === 'Applied' ? 'mark_applied' : 'update_status'),
    apply_url: j.apply_url || '',
    job_title: j.job_title || '',
    company: j.company || '',
    status,
    applied_at: appliedAt,
    sent_at: new Date().toISOString()
  };
  try{
    submitSheetSyncForm(endpoint, fields);
    return Promise.resolve(true);
  } catch(err){
    console.warn('Could not sync job status to Sheets', err);
    return Promise.resolve(false);
  }
}

const appliedKeys = loadStoredKeys(APPLIED_STORE_KEY);
const invalidKeys = loadStoredKeys(INVALID_STORE_KEY);
const validKeys = loadStoredKeys(VALID_STORE_KEY);
JOBS.forEach((j, i) => {
  j._idx = i;
  const key = jobKey(j);
  if(isApplied(j) && key) appliedKeys.add(key);
  if(isInvalid(j) && key) invalidKeys.add(key);
  if(key && validKeys.has(key)){
    invalidKeys.delete(key);
    if(isInvalid(j)) j.status = 'New';
  } else if(key && (invalidKeys.has(key) || looksLikeDirectoryListing(j))){
    j.status = 'Invalid';
    invalidKeys.add(key);
    appliedKeys.delete(key);
  } else if(key && appliedKeys.has(key)){
    j.status = 'Applied';
  }
});
saveStoredKeys(APPLIED_STORE_KEY, appliedKeys);
saveStoredKeys(INVALID_STORE_KEY, invalidKeys);
saveStoredKeys(VALID_STORE_KEY, validKeys);
const newCutoff = JOBS.length > 0 ? JOBS[Math.floor(JOBS.length * 0.80)]._idx : Infinity;
const GEN_DATE = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

function getTier(c){
  const s=(c||'').toLowerCase();
  if(s.includes('(mnc)'))      return 'MNC';
  if(s.includes('(startup)'))  return 'startup';
  if(s.includes('(mid-tier)')) return 'mid-tier';
  return 'unknown';
}
function stripTier(c){ return (c||'').replace(/\s*\(.*?\)\s*$/, '').trim(); }
function initialsFrom(text){
  const words = (text || '').replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return 'JOB';
  if(words.length === 1) return words[0].slice(0,3).toUpperCase();
  return words.slice(0,2).map(w => w[0]).join('').toUpperCase();
}
function oddsClass(h){ const p = h != null ? Math.round((h/7)*100) : 0; return p >= 70 ? 'hi' : p >= 50 ? 'med' : 'lo'; }
const TIER_CLS   = {MNC:'co-mnc', startup:'co-startup', 'mid-tier':'co-mid'};
const TIER_LABEL = {MNC:'MNC', startup:'Startup', 'mid-tier':'Mid-tier'};

const DOC_ICO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const EXT_ICO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`;
const CHECK_ICO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>`;

function buildCard(j, animIdx){
  const tier    = getTier(j.company);
  const name    = stripTier(j.company);
	  const isNew   = isNewJob(j);
	  const applied = isApplied(j);
	  const invalid = isInvalid(j);
	  const key     = encodeURIComponent(jobKey(j));
  const hire    = j.hireability;
  const pct     = hire != null ? Math.round((hire/7)*100) : null;
  const oc      = oddsClass(hire);
  const tierCls = TIER_CLS[tier] || '';
  const tierLbl = TIER_LABEL[tier] || '';
  const expClean = (j.experience_required && j.experience_required !== 'null') ? j.experience_required : null;
  const logo    = initialsFrom(name || j.company || j.job_title);
  const salaryClean = (j.salary_range && j.salary_range !== 'null') ? j.salary_range : null;
  const dateClean   = (j.posted_date  && j.posted_date  !== 'null') ? j.posted_date.slice(0,10) : null;

  const tags = [
    `<span class="tag">Bengaluru</span>`,
    salaryClean ? `<span class="tag">${salaryClean}</span>` : '',
    dateClean   ? `<span class="tag">${dateClean}</span>` : '',
    expClean ? `<span class="tag tag-exp">${expClean}</span>` : ''
  ].filter(Boolean).join('');

  const scorePanel = hire != null ? `
    <div class="card-right">
      <span class="score-line"></span>
      <span class="odds-pct ${oc}">${pct}/100</span>
    </div>` : `
    <div class="card-right">
      <span class="score-line"></span>
      <span class="odds-pct">--/100</span>
    </div>`;

  return `
	<div class="card ${invalid ? 'is-invalid' : ''}" style="animation-delay:${Math.min(animIdx,30)*.025}s">
	  <div class="logo-chip">${logo}</div>
	  <div class="card-left">
	    <div class="title-row">
	      <span class="card-title">${j.job_title}</span>
	      ${isNew ? '<span class="new-badge">New</span>' : ''}
	      ${applied ? '<span class="applied-badge">Applied</span>' : ''}
	      ${invalid ? '<span class="invalid-badge">Invalid</span>' : ''}
	    </div>
    <div class="co-row">
      ${name ? `<span>${name}</span><span class="co-sep">·</span>` : ''}
      ${j.domain ? `<span>${j.domain}</span><span class="co-sep">·</span>` : ''}
      ${tierCls ? `<span class="co-tier ${tierCls}">${tierLbl}</span><span class="co-sep">·</span>` : ''}
      <span>Full-time</span>
    </div>
    <div class="tag-row">${tags}</div>
    ${j.summary ? `<div class="card-summary">${j.summary}</div>` : ''}
	    <div class="card-actions">
	      <a href="${j.apply_url}" target="_blank" rel="noopener" class="btn-apply">Apply</a>
	      ${invalid
	        ? `<button type="button" class="btn-sm btn-mark-applied" data-valid-key="${key}">${CHECK_ICO} Mark valid</button>`
	        : `<button type="button" class="btn-sm btn-mark-applied ${applied ? 'is-applied' : ''}" data-apply-key="${key}">${CHECK_ICO} ${applied ? 'Undo' : 'Mark applied'}</button>
	           <button type="button" class="btn-sm btn-mark-invalid" data-invalid-key="${key}">Invalid</button>`}
	      ${j.resume_doc_link ? `<a href="${j.resume_doc_link}" target="_blank" rel="noopener" class="btn-sm">${DOC_ICO} Resume .doc</a>` : ''}
      ${j.resume_pdf_link ? `<a href="${j.resume_pdf_link}" download="Akshay_P_Resume.pdf" rel="noopener" class="btn-sm">${DOC_ICO} .pdf</a>` : ''}
    </div>
  </div>
  ${scorePanel}
</div>`;
}

const SECTIONS = [
  { id:'top',    label:'Top Matches',       sub:'— Excellent fit',        test: j => (j.hireability||0) >= 5.5 },
  { id:'strong', label:'Strong Matches',    sub:'— Good fit, some gaps',  test: j => (j.hireability||0) >= 4 && (j.hireability||0) < 5.5 },
  { id:'maybe',  label:'Potential Matches', sub:'— Worth exploring',       test: j => (j.hireability||0) >= 2.5 && (j.hireability||0) < 4 },
  { id:'other',  label:'Other Listings',    sub:'',                        test: () => true },
];

let domF='all', tierF='all', statusF='all', searchQ='', sortBy='default';

function applySort(arr){
  const a = [...arr];
  switch(sortBy){
    case 'newest':    return a.sort((x,y) => y._idx - x._idx);
    case 'hire_desc': return a.sort((x,y) => (y.hireability||0) - (x.hireability||0));
    case 'cred_desc': return a.sort((x,y) => (y.credibility||0) - (x.credibility||0));
    case 'date_desc': return a.sort((x,y) => { const pd=(y.posted_date||'').localeCompare(x.posted_date||''); return pd!==0?pd:y._idx-x._idx; });
    case 'az': return a.sort((x,y) => (x.job_title||'').localeCompare(y.job_title||''));
    case 'za': return a.sort((x,y) => (y.job_title||'').localeCompare(x.job_title||''));
    default:   return a.sort((x,y) => y._idx - x._idx);
  }
}

function getFiltered(){
  return JOBS.filter(j => {
    if(domF    !== 'all' && j.domain !== domF) return false;
    if(tierF   !== 'all' && getTier(j.company) !== tierF) return false;
    if(statusF === 'all' && isInvalid(j)) return false;
    if(statusF !== 'all' && normStatus(j) !== statusF.toLowerCase()) return false;
    if(searchQ){
      const q = searchQ.toLowerCase();
      if(!(j.job_title||'').toLowerCase().includes(q) &&
         !(j.company||'').toLowerCase().includes(q)   &&
         !(j.summary||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const raw    = getFiltered();
  const sorted = applySort(raw);
  const feed   = document.getElementById('feed');
  const empty  = document.getElementById('empty');

  document.getElementById('shownCount').textContent = sorted.length;
  document.getElementById('totalCount').textContent = JOBS.filter(j => !isInvalid(j)).length;
  document.getElementById('newCount').textContent = JOBS.filter(isNewJob).length;

  if(!sorted.length){ feed.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  const showingOnlyApplied = statusF.toLowerCase() === 'applied';
  const showingOnlyInvalid = statusF.toLowerCase() === 'invalid';
  const appliedJobs = (statusF === 'all' || showingOnlyApplied) ? sorted.filter(isApplied) : [];
  const invalidJobs = showingOnlyInvalid ? sorted.filter(isInvalid) : [];

  if(sortBy !== 'default'){
    let html='', animI=0;
    const visibleJobs = (showingOnlyApplied || showingOnlyInvalid) ? [] : sorted.filter(j => !isApplied(j) && !isInvalid(j));
    visibleJobs.forEach(j => { html += buildCard(j, animI++); });
    if(appliedJobs.length){
      html += `<div class="section-head">
        <span class="sh-label">Applied Jobs</span>
        <span class="sh-sub"> — ${appliedJobs.length} tracked</span>
      </div>`;
      appliedJobs.forEach(j => { html += buildCard(j, animI++); });
    }
    if(invalidJobs.length){
      html += `<div class="section-head">
        <span class="sh-label">Invalid Jobs</span>
        <span class="sh-sub"> — ${invalidJobs.length} hidden from My Jobs</span>
      </div>`;
      invalidJobs.forEach(j => { html += buildCard(j, animI++); });
    }
    feed.innerHTML = html;
    return;
  }

  let html='', animI=0, remaining=(showingOnlyApplied || showingOnlyInvalid) ? [] : sorted.filter(j => !isApplied(j) && !isInvalid(j));

  SECTIONS.forEach(sec => {
    const group = remaining.filter(sec.test);
    remaining   = remaining.filter(j => !sec.test(j));
    if(!group.length) return;
    const gs = [...group].sort((a,b) => b._idx - a._idx);
    html += `<div class="section-head">
      <span class="sh-label">${sec.label}</span>
      ${sec.sub ? `<span class="sh-sub"> ${sec.sub}</span>` : ''}
    </div>`;
    gs.forEach(j => { html += buildCard(j, animI++); });
  });

  if(appliedJobs.length){
    const appliedSorted = [...appliedJobs].sort((a,b) => b._idx - a._idx);
    html += `<div class="section-head">
      <span class="sh-label">Applied Jobs</span>
      <span class="sh-sub"> — ${appliedSorted.length} tracked</span>
    </div>`;
    appliedSorted.forEach(j => { html += buildCard(j, animI++); });
  }

  if(invalidJobs.length){
    const invalidSorted = [...invalidJobs].sort((a,b) => b._idx - a._idx);
    html += `<div class="section-head">
      <span class="sh-label">Invalid Jobs</span>
      <span class="sh-sub"> — ${invalidSorted.length} hidden from My Jobs</span>
    </div>`;
    invalidSorted.forEach(j => { html += buildCard(j, animI++); });
  }

  feed.innerHTML = html;
}

document.getElementById('totalCount').textContent = JOBS.filter(j => !isInvalid(j)).length;
document.getElementById('newCount').textContent   = JOBS.filter(isNewJob).length;
document.getElementById('updatedAt').textContent  = GEN_DATE;

document.getElementById('domainSel').addEventListener('change', e => {
  domF = e.target.value;
  render();
});
document.querySelectorAll('.chip[data-f="tier"]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-f="tier"]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tierF = b.dataset.v; render();
}));
document.querySelectorAll('.chip[data-f="status"]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-f="status"]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); statusF = b.dataset.v; render();
}));

let searchTimer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQ = e.target.value.trim(); render(); }, 150);
});
document.getElementById('sortSel').addEventListener('change', e => { sortBy = e.target.value; render(); });

document.getElementById('feed').addEventListener('click', e => {
  const invalidBtn = e.target.closest('[data-invalid-key]');
  const validBtn = e.target.closest('[data-valid-key]');
  const btn = e.target.closest('[data-apply-key]');
  if(invalidBtn || validBtn){
    const key = decodeURIComponent((invalidBtn || validBtn).dataset.invalidKey || (invalidBtn || validBtn).dataset.validKey || '');
    const job = JOBS.find(j => jobKey(j) === key);
    if(!job) return;
    if(invalidBtn){
      job.status = 'Invalid';
      job.invalid_at = new Date().toISOString();
      appliedKeys.delete(key);
      invalidKeys.add(key);
      validKeys.delete(key);
      saveStoredKeys(APPLIED_STORE_KEY, appliedKeys);
      saveStoredKeys(INVALID_STORE_KEY, invalidKeys);
      saveStoredKeys(VALID_STORE_KEY, validKeys);
      syncStatusToSheet(job, 'Invalid', 'mark_invalid');
    } else {
      job.status = 'New';
      job.invalid_at = '';
      invalidKeys.delete(key);
      validKeys.add(key);
      saveStoredKeys(INVALID_STORE_KEY, invalidKeys);
      saveStoredKeys(VALID_STORE_KEY, validKeys);
      syncStatusToSheet(job, 'New', 'mark_valid');
    }
    render();
    return;
  }
  if(!btn) return;
  const key = decodeURIComponent(btn.dataset.applyKey || '');
  const job = JOBS.find(j => jobKey(j) === key);
  if(!job) return;
  if(isApplied(job)){
    job.status = 'New';
    job.applied_at = '';
    appliedKeys.delete(key);
    saveStoredKeys(APPLIED_STORE_KEY, appliedKeys);
    syncStatusToSheet(job, 'New', 'undo_applied');
  } else {
    job.status = 'Applied';
    job.applied_at = new Date().toISOString();
    appliedKeys.add(key);
    saveStoredKeys(APPLIED_STORE_KEY, appliedKeys);
    syncStatusToSheet(job, 'Applied', 'mark_applied');
  }
  render();
});

render();
</script>
</body>
</html>
