<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberJobs Bangalore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #F2F2F7;
  --bg2:        #FFFFFF;
  --bg3:        #F2F2F7;
  --t1:         #1C1C1E;
  --t2:         #3A3A3C;
  --t3:         #636366;
  --t4:         #AEAEB2;
  --sep:        rgba(60,60,67,.13);
  --sep2:       rgba(60,60,67,.06);
  --blue:       #007AFF;
  --blue-dim:   rgba(0,122,255,.08);
  --soc:        #0A84FF;
  --grc:        #5E5CE6;
  --appsec:     #30D158;
  --vapt:       #FF6B35;
  --cloud:      #32ADE6;
  --iam:        #FF375F;
  --risk:       #FF9F0A;
  --fraud:      #BF5AF2;
  --forensics:  #00C7BE;
  --general:    #8E8E93;
  --r:          12px;
  --r-sm:       8px;
  --r-xs:       6px;
  --shadow:     0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --shadow-h:   0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);
  --ease:       cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:200;background:rgba(242,242,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep);}
.navbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;}
.nav-brand{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.nav-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(10,132,255,.35);}
.nav-icon svg{width:14px;height:14px;color:#fff;}
.nav-title{font-size:.9rem;font-weight:800;color:var(--t1);letter-spacing:-.025em;}
.nav-title span{color:var(--blue);}
.search-wrap{flex:1;max-width:380px;position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--t4);pointer-events:none;}
#searchInput{width:100%;padding:7.5px 12px 7.5px 30px;background:var(--bg2);border:1px solid var(--sep);border-radius:9px;font-family:'Manrope',sans-serif;font-size:.81rem;font-weight:400;color:var(--t1);outline:none;transition:border-color .18s,box-shadow .18s;}
#searchInput::placeholder{color:var(--t4);}
#searchInput:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim);}
.nav-stats{margin-left:auto;display:flex;align-items:center;gap:18px;flex-shrink:0;}
.sitem{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.sitem .v{font-size:.85rem;font-weight:800;color:var(--t1);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.sitem .l{font-size:.58rem;font-weight:600;color:var(--t4);letter-spacing:.06em;text-transform:uppercase;}
.sort-sel{padding:5px 9px;background:var(--bg2);border:1px solid var(--sep);border-radius:var(--r-sm);font-family:'Manrope',sans-serif;font-size:.72rem;font-weight:600;color:var(--t2);cursor:pointer;outline:none;transition:border-color .15s;}
.sort-sel:focus{border-color:var(--blue);}
.sort-sel option{background:#fff;}

/* FILTERBAR */
.filterbar{background:rgba(242,242,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--sep);}
.filterbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:6px;height:44px;padding:0 24px;overflow-x:auto;scrollbar-width:none;}
.filterbar-inner::-webkit-scrollbar{display:none;}
.flbl{font-size:.6rem;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;flex-shrink:0;margin-right:2px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:600;border:1.5px solid transparent;background:transparent;color:var(--t3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .14s var(--ease);outline:none;-webkit-tap-highlight-color:transparent;}
.chip:hover{color:var(--t1);background:rgba(0,0,0,.04);}
.chip.active{background:var(--bg2);border-color:var(--sep);color:var(--t1);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--dc,var(--general));flex-shrink:0;}
.cdiv{width:1px;height:14px;background:var(--sep);flex-shrink:0;margin:0 2px;}

/* PAGE */
.page{max-width:1280px;margin:0 auto;padding:18px 24px 64px;}
.resmeta{display:flex;align-items:center;margin-bottom:14px;}
.resmeta p{font-size:.75rem;font-weight:500;color:var(--t3);}
.resmeta strong{color:var(--t1);font-weight:800;}

/* GRID */
#cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:10px;}

/* CARD */
.card{background:var(--bg2);border-radius:var(--r);border:1px solid var(--sep2);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;animation:rise .32s var(--ease) both;transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease);}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-1px);border-color:var(--sep);}
@keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}
.stripe{position:absolute;top:0;left:0;right:0;height:2.5px;border-radius:var(--r) var(--r) 0 0;background:var(--sc,var(--general));opacity:.8;}
.card[data-domain="SOC"]       {--sc:var(--soc);}
.card[data-domain="GRC"]       {--sc:var(--grc);}
.card[data-domain="AppSec"]    {--sc:var(--appsec);}
.card[data-domain="VAPT"]      {--sc:var(--vapt);}
.card[data-domain="CloudSec"]  {--sc:var(--cloud);}
.card[data-domain="IAM"]       {--sc:var(--iam);}
.card[data-domain="Risk"]      {--sc:var(--risk);}
.card[data-domain="Fraud-AML"] {--sc:var(--fraud);}
.card[data-domain="Forensics"] {--sc:var(--forensics);}

/* CARD HEAD */
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.badges{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:999px;font-size:.62rem;font-weight:700;letter-spacing:.01em;border:1px solid transparent;}
.badge .d{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;}
.b-soc      {color:var(--soc);background:rgba(10,132,255,.07);border-color:rgba(10,132,255,.16);}
.b-grc      {color:var(--grc);background:rgba(94,92,230,.07);border-color:rgba(94,92,230,.16);}
.b-appsec   {color:var(--appsec);background:rgba(48,209,88,.07);border-color:rgba(48,209,88,.16);}
.b-vapt     {color:var(--vapt);background:rgba(255,107,53,.07);border-color:rgba(255,107,53,.16);}
.b-cloud    {color:var(--cloud);background:rgba(50,173,230,.07);border-color:rgba(50,173,230,.16);}
.b-iam      {color:var(--iam);background:rgba(255,55,95,.07);border-color:rgba(255,55,95,.16);}
.b-risk     {color:var(--risk);background:rgba(255,159,10,.07);border-color:rgba(255,159,10,.16);}
.b-fraud    {color:var(--fraud);background:rgba(191,90,242,.07);border-color:rgba(191,90,242,.16);}
.b-forensics{color:var(--forensics);background:rgba(0,199,190,.07);border-color:rgba(0,199,190,.16);}
.b-general  {color:var(--t3);background:var(--bg3);border-color:var(--sep);}
.b-intern   {color:var(--risk);background:rgba(255,159,10,.07);border-color:rgba(255,159,10,.18);}
.b-new      {color:var(--blue);background:rgba(0,122,255,.07);border-color:rgba(0,122,255,.18);}
.src-tag{font-size:.58rem;font-weight:700;color:var(--t4);letter-spacing:.05em;text-transform:uppercase;background:var(--bg3);border:1px solid var(--sep2);border-radius:var(--r-xs);padding:2px 5px;flex-shrink:0;}

/* TITLE */
.co-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.co-name{font-size:.73rem;font-weight:600;color:var(--t3);}
.tier-tag{font-size:.57rem;font-weight:600;padding:2px 5px;border-radius:4px;border:1px solid transparent;}
.t-mnc    {color:var(--soc);background:rgba(10,132,255,.06);border-color:rgba(10,132,255,.14);}
.t-startup{color:var(--appsec);background:rgba(48,209,88,.06);border-color:rgba(48,209,88,.14);}
.t-mid    {color:var(--risk);background:rgba(255,159,10,.06);border-color:rgba(255,159,10,.14);}
.t-unknown{color:var(--t4);background:var(--bg3);border-color:var(--sep2);}
.card-title{font-size:1rem;font-weight:800;color:var(--t1);letter-spacing:-.025em;line-height:1.28;}
.card-summary{font-size:.74rem;font-weight:400;color:var(--t3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* STATS BLOCK — Apify actor stats */
.stats-block{display:flex;background:var(--bg3);border-radius:var(--r-sm);border:1px solid var(--sep2);overflow:hidden;}
.sc{flex:1;padding:7px 9px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--sep2);min-width:0;}
.sc:last-child{border-right:none;}
.sc .sl{font-size:.56rem;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;}
.sc .sv{font-size:.78rem;font-weight:700;color:var(--t1);letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sv.hi{color:var(--appsec);}
.sv.med{color:var(--risk);}
.sv.lo{color:var(--iam);}
.sv.na{color:var(--t4);font-weight:500;}

/* SCORE BARS */
.score-row{display:flex;gap:10px;}
.si{flex:1;display:flex;flex-direction:column;gap:4px;}
.sh{display:flex;align-items:center;justify-content:space-between;}
.sn{font-size:.6rem;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.07em;}
.sf{font-size:.68rem;font-weight:800;font-variant-numeric:tabular-nums;}
.sf.hi{color:var(--appsec);}
.sf.med{color:var(--risk);}
.sf.lo{color:var(--iam);}
.sf.na{color:var(--t4);}
.st{height:3px;border-radius:99px;background:var(--sep);overflow:hidden;}
.sf2{height:100%;border-radius:99px;transition:width .45s var(--ease);}
.fhi{background:var(--appsec);}
.fmed{background:var(--risk);}
.flo{background:var(--iam);}

/* FOOTER */
.card-footer{display:flex;align-items:center;gap:5px;padding-top:1px;}
.btn-apply{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 13px;border-radius:var(--r-sm);font-family:'Manrope',sans-serif;font-size:.74rem;font-weight:700;text-decoration:none;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:background .14s,transform .1s,box-shadow .14s;box-shadow:0 1px 4px rgba(0,122,255,.28);letter-spacing:-.01em;}
.btn-apply:hover{background:#0066DD;box-shadow:0 2px 8px rgba(0,122,255,.38);transform:translateY(-1px);}
.btn-apply:active{transform:none;}
.btn-apply svg{width:11px;height:11px;flex-shrink:0;}
.btn-res{display:inline-flex;align-items:center;gap:3px;padding:8px 10px;border-radius:var(--r-sm);font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:700;text-decoration:none;background:var(--bg3);color:var(--t2);border:1px solid var(--sep);cursor:pointer;transition:all .14s var(--ease);letter-spacing:-.01em;}
.btn-res:hover{background:var(--bg2);border-color:var(--t4);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.07);}
.btn-res svg{width:10px;height:10px;flex-shrink:0;}

/* EMPTY */
#emptyState{display:none;grid-column:1/-1;padding:80px 24px;text-align:center;}
.ei{font-size:1.8rem;margin-bottom:10px;}
.et{font-size:.95rem;font-weight:700;color:var(--t1);letter-spacing:-.02em;margin-bottom:3px;}
.es{font-size:.78rem;color:var(--t3);}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--sep);border-radius:3px;}

@media(max-width:640px){
  .navbar-inner,.filterbar-inner,.page{padding-left:14px;padding-right:14px;}
  .nav-stats,.sort-sel{display:none;}
  #cardGrid{grid-template-columns:1fr;gap:8px;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="nav-brand">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="nav-title">Cyber<span>Jobs</span> BLR</span>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search roles, companies…" autocomplete="off" spellcheck="false">
    </div>

    <div class="nav-stats">
      <div class="sitem"><span class="v" id="totalCount">—</span><span class="l">Listings</span></div>
      <div class="sitem"><span class="v" id="mncCount">—</span><span class="l">MNC</span></div>
      <div class="sitem"><span class="v" id="internCount">—</span><span class="l">Intern</span></div>
    </div>
    <select class="sort-sel" id="sortSelect">
      <option value="default">Relevance</option>
      <option value="hireability">Hireability ↓</option>
      <option value="credibility">Credibility ↓</option>
      <option value="date">Date posted</option>
      <option value="az">Title A–Z</option>
    </select>
  </div>
</nav>

<div class="filterbar">
  <div class="filterbar-inner">
    <span class="flbl">Domain</span>
    <button class="chip active" data-domain="all">All</button>
    <button class="chip" data-domain="SOC"><span class="dot" style="--dc:var(--soc)"></span>SOC</button>
    <button class="chip" data-domain="GRC"><span class="dot" style="--dc:var(--grc)"></span>GRC</button>
    <button class="chip" data-domain="AppSec"><span class="dot" style="--dc:var(--appsec)"></span>AppSec</button>
    <button class="chip" data-domain="VAPT"><span class="dot" style="--dc:var(--vapt)"></span>VAPT</button>
    <button class="chip" data-domain="CloudSec"><span class="dot" style="--dc:var(--cloud)"></span>CloudSec</button>
    <button class="chip" data-domain="IAM"><span class="dot" style="--dc:var(--iam)"></span>IAM</button>
    <button class="chip" data-domain="Risk"><span class="dot" style="--dc:var(--risk)"></span>Risk</button>
    <button class="chip" data-domain="Fraud-AML"><span class="dot" style="--dc:var(--fraud)"></span>Fraud</button>
    <button class="chip" data-domain="Forensics"><span class="dot" style="--dc:var(--forensics)"></span>Forensics</button>
    <button class="chip" data-domain="General"><span class="dot" style="--dc:var(--general)"></span>General</button>
    <div class="cdiv"></div>
    <span class="flbl">Tier</span>
    <button class="chip active" data-tier="all">All</button>
    <button class="chip" data-tier="MNC">MNC</button>
    <button class="chip" data-tier="startup">Startup</button>
    <button class="chip" data-tier="mid-tier">Mid-tier</button>
  </div>
</div>

<main class="page">
  <div class="resmeta">
    <p><strong id="shownCount">—</strong> listings</p>
  </div>
  <div id="cardGrid">
    <div id="emptyState">
      <div class="ei">🔍</div>
      <p class="et">No listings found</p>
      <p class="es">Try adjusting your filters or search.</p>
    </div>
  </div>
</main>

<script>
/*JOBS_PLACEHOLDER*/

const TIER_CLS = {MNC:'t-mnc',startup:'t-startup','mid-tier':'t-mid',unknown:'t-unknown'};
const DOM_CLS  = {SOC:'b-soc',GRC:'b-grc',AppSec:'b-appsec',VAPT:'b-vapt',CloudSec:'b-cloud',IAM:'b-iam',Risk:'b-risk','Fraud-AML':'b-fraud',Forensics:'b-forensics',General:'b-general'};
const SRC_LBL  = {linkedin:'LI',linkedin_post:'LI+',workday:'WD',ashby:'AB'};

function getTier(c){const s=(c||'').toLowerCase();if(s.includes('(mnc)'))return'MNC';if(s.includes('(startup)'))return'startup';if(s.includes('(mid-tier)'))return'mid-tier';return'unknown';}
function strip(c){return(c||'').replace(/\s*\(.*?\)\s*$/,'').trim();}
function sc(n){if(n==null)return'na';return n>=6?'hi':n>=4?'med':'lo';}
function fc(n){if(n==null)return'flo';return n>=6?'fhi':n>=4?'fmed':'flo';}

const DOC=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const EXT=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>`;

function card(j,i){
  const tier=getTier(j.company),name=strip(j.company);
  const intern=/intern|trainee|apprentice/i.test(`${j.job_title} ${j.experience_required||''}`);
  const hire=j.hireability,cred=j.credibility;
  const hasS=hire!=null||cred!=null;
  return`<div class="card" data-domain="${j.domain}" data-tier="${tier}" style="animation-delay:${Math.min(i,28)*.028}s">
  <div class="stripe"></div>
  <div class="card-head">
    <div class="badges">
      <span class="badge ${DOM_CLS[j.domain]||'b-general'}"><span class="d"></span>${j.domain}</span>
      ${intern?'<span class="badge b-intern">Intern</span>':''}
      <span class="badge b-new">New</span>
    </div>
    <span class="src-tag">${SRC_LBL[j.source]||j.source}</span>
  </div>
  <div>
    <div class="co-row"><span class="co-name">${name}</span><span class="tier-tag ${TIER_CLS[tier]||'t-unknown'}">${tier==='unknown'?'—':tier}</span></div>
    <div class="card-title">${j.job_title}</div>
  </div>
  ${j.summary?`<div class="card-summary">${j.summary}</div>`:''}
  <div class="stats-block">
    <div class="sc"><span class="sl">Exp</span><span class="sv">${j.experience_required||'—'}</span></div>
    <div class="sc"><span class="sl">Salary</span><span class="sv">${j.salary_range||'—'}</span></div>
    <div class="sc"><span class="sl">Posted</span><span class="sv">${j.posted_date?j.posted_date.slice(5):'—'}</span></div>
  </div>
  ${hasS?`<div class="score-row">
    ${hire!=null?`<div class="si"><div class="sh"><span class="sn">Hireability</span><span class="sf ${sc(hire)}">${hire}/7</span></div><div class="st"><div class="sf2 ${fc(hire)}" style="width:${(hire/7*100).toFixed(1)}%"></div></div></div>`:''}
    ${cred!=null?`<div class="si"><div class="sh"><span class="sn">Credibility</span><span class="sf hi">${cred}/6</span></div><div class="st"><div class="sf2 fhi" style="width:${(cred/6*100).toFixed(1)}%"></div></div></div>`:''}
  </div>`:''}
  <div class="card-footer">
    <a href="${j.apply_url}" target="_blank" rel="noopener" class="btn-apply">${EXT} Apply now</a>
    ${j.resume_doc_link?`<a href="${j.resume_doc_link}" target="_blank" rel="noopener" class="btn-res">${DOC}.doc</a>`:''}
    ${j.resume_pdf_link?`<a href="${j.resume_pdf_link}" target="_blank" rel="noopener" class="btn-res">${DOC}.pdf</a>`:''}
  </div>
</div>`;
}

let df='all',tf='all',sq='',sb='default';
function filtered(){
  let d=[...JOBS];
  if(df!=='all')d=d.filter(j=>j.domain===df);
  if(tf!=='all')d=d.filter(j=>getTier(j.company)===tf);
  if(sq){const q=sq.toLowerCase();d=d.filter(j=>(j.job_title||'').toLowerCase().includes(q)||(j.company||'').toLowerCase().includes(q)||(j.summary||'').toLowerCase().includes(q));}
  if(sb==='hireability')d.sort((a,b)=>(b.hireability||0)-(a.hireability||0));
  else if(sb==='credibility')d.sort((a,b)=>(b.credibility||0)-(a.credibility||0));
  else if(sb==='date')d.sort((a,b)=>(b.posted_date||'').localeCompare(a.posted_date||''));
  else if(sb==='az')d.sort((a,b)=>(a.job_title||'').localeCompare(b.job_title||''));
  return d;
}
function render(){
  const d=filtered(),g=document.getElementById('cardGrid'),e=document.getElementById('emptyState');
  document.getElementById('shownCount').textContent=d.length;
