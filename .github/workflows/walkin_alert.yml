name: Walk-In Job Scanner

# ── RUNS FIRST ────────────────────────────────────────────────────────────────
# Scans LinkedIn/Workday/Ashby → writes new jobs to Google Sheet.
# Resume Tailor listens for this workflow's completion and runs next.

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST — morning      (catches overnight posts)
    - cron: "30 7 * * *"   # 13:00 IST — afternoon    (catches morning posts)
    - cron: "30 13 * * *"  # 19:00 IST — evening      (catches afternoon posts)
    - cron: "30 18 * * *"  # 00:00 IST — midnight     (catches US EOD posts)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python scanner.py
