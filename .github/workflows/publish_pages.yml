name: Publish Job Board to GitHub Pages

on:
  schedule:
    - cron: "30 2 * * *"   # 07:00 IST — morning run
    - cron: "30 7 * * *"   # 13:00 IST — afternoon run
    - cron: "30 13 * * *"  # 19:00 IST — evening run
  workflow_run:
    workflows: ["Walk-In Job Scanner"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl gspread google-auth

      - name: Pull latest data from Google Sheets and generate HTML
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          python generate_html.py \
            --source sheets \
            --template docs/index.html \
            --out docs/index.html

      - name: Commit updated HTML to docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: refresh job board [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
